<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ripplets</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF4E4;
    --paper: #F3EAD3;
    --ink: #201B14;
    --sky: #7FCBE8;
    --coral: #FF6F3C;
    --coral-deep: #D9481E;
    --yolk: #FFC93C;
    --line: #201B14;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--sky) url('assets/scenes/hero_banner.png') center/cover no-repeat fixed;
    color: var(--ink);
    font-family: 'Patrick Hand', sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: rgba(251, 244, 228, 0.45); z-index: 0;
  }

  h1, .headline { font-family: 'Kalam', cursive; font-weight: 700; margin: 0; }

  .landing {
    position: relative; z-index: 1; width: 100%; max-width: 400px;
    background: #fff; border: 3.5px solid var(--line); border-radius: 22px;
    padding: 26px 24px 22px; box-shadow: 8px 8px 0 var(--line);
    transform: rotate(-0.5deg); text-align: center;
  }

  .badge {
    display: inline-block; background: var(--yolk); border: 2.5px solid var(--line);
    border-radius: 999px; padding: 5px 16px; font-size: 13px; font-weight: 700;
    transform: rotate(-3deg); margin-bottom: 14px; box-shadow: 3px 3px 0 var(--line);
  }

  h1.title { font-size: 40px; margin-bottom: 18px; }

  .intro-row {
    display: flex; align-items: flex-start; gap: 12px; text-align: left;
    margin-bottom: 16px; min-height: 110px;
  }
  .intro-avatar {
    width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid var(--line);
    overflow: hidden; flex-shrink: 0; background: var(--sky);
  }
  .intro-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .intro-bubble {
    background: var(--paper); border: 2.5px solid var(--line); border-radius: 4px 16px 16px 16px;
    padding: 13px 15px; font-size: 16px; line-height: 1.45;
  }

  .intro-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .intro-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--line); }
  .intro-dot.active { background: var(--coral); }

  .intro-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .intro-nav button {
    font-family: 'Kalam', cursive; font-weight: 700; font-size: 14px; border: 2.5px solid var(--line);
    border-radius: 10px; padding: 8px 15px; background: #fff; cursor: pointer;
    box-shadow: 3px 3px 0 var(--line);
  }
  .intro-nav button:disabled { opacity: 0.3; cursor: default; box-shadow: none; }
  .intro-nav button:not(:disabled):hover { transform: translate(-1px,-1px); }
  .intro-nav .next-btn { background: var(--coral); color: #fff; }
  .intro-nav .skip-btn { background: none; border: none; box-shadow: none; opacity: 0.55; font-size: 13px; text-decoration: underline; }

  .final-screen { display: none; }
  .final-screen.show { display: block; }
  .final-screen .mascot {
    width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--line);
    overflow: hidden; margin: 0 auto 14px; box-shadow: 4px 4px 0 var(--line);
  }
  .final-screen .mascot img { width: 100%; height: 100%; object-fit: cover; }
  .final-screen p { font-size: 15px; margin: 0 0 16px; }

  .search-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .search-row input {
    flex: 1; padding: 12px 14px; border: 2.5px solid var(--line); border-radius: 12px;
    font-family: 'Patrick Hand', sans-serif; font-size: 15px; background: var(--paper);
  }

  .btn-main {
    font-family: 'Kalam', cursive; font-weight: 700; font-size: 16px; border: 3px solid var(--line);
    border-radius: 12px; padding: 12px 18px; background: var(--coral); color: #fff;
    box-shadow: 4px 4px 0 var(--line); cursor: pointer;
  }
  .btn-main:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--line); }
  .btn-main:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--line); }

  .skip-link {
    display: block; text-align: center; margin-top: 14px; font-size: 13px;
    opacity: 0.6; text-decoration: underline; cursor: pointer;
  }
  .sound-toggle {
    position: fixed; bottom: 18px; right: 18px; z-index: 10;
    width: 48px; height: 48px; border-radius: 50%;
    background: #fff; border: 2.5px solid var(--line);
    box-shadow: 3px 3px 0 var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer;
  }
  .sound-toggle:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--line); }

  .socials {
    position: relative; z-index: 1;
    display: flex; justify-content: center; gap: 10px; margin-top: 16px;
  }
  .social-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 2.5px solid var(--line); border-radius: 999px;
    padding: 7px 16px; font-family: 'Kalam', cursive; font-weight: 700; font-size: 14px;
    text-decoration: none; color: var(--ink); box-shadow: 3px 3px 0 var(--line);
  }
  .social-link:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--line); }
</style>
</head>
<body>

<div class="landing">

  <div id="introScreen">
    <h1 class="title">ripplets</h1>

    <div class="intro-row">
      <div class="intro-avatar"><img src="assets/pengy_base.png" alt="Ripplet"></div>
      <div class="intro-bubble" id="introText">hii, i'm a ripplet 🐧 got a sec? lemme explain what this is.</div>
    </div>

    <div class="intro-dots" id="introDots"></div>

    <div class="intro-nav">
      <button id="prevBtn" onclick="introPrev()">back</button>
      <button class="skip-btn" onclick="showFinal()">skip</button>
      <button class="next-btn" id="nextBtn" onclick="introNext()">next</button>
    </div>
  </div>

  <div class="final-screen" id="finalScreen">
    <div class="mascot"><img src="assets/scenes/success_state.png" alt="Ready"></div>
    <p>that's the whole pitch. paste your wallet address below to see your ripplets:</p>
    <div class="search-row">
      <input type="text" id="walletInput" placeholder="rXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX">
    </div>
    <button class="btn-main" onclick="goCheck()" style="width:100%;">🔍 check my ripplets</button>
  </div>

</div>

<div class="socials">
  <a class="social-link" href="https://t.me/Ripplets_Xrpl" target="_blank" rel="noopener">💬 telegram</a>
  <a class="social-link" href="https://x.com/Ripplets_XRPL" target="_blank" rel="noopener">🐦 x</a>
</div>

<button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔇</button>
<audio id="bgAudio" src="assets/ambient.mp3" loop preload="none"></audio>

<script>
  const introSlides = [
    "hii, i'm a ripplet 🐧 got a sec? lemme explain what this is.",
    "100 of us live on the xrp ledger. every ripplet is hand-drawn, no two look alike.",
    "if you hold a ripplet nft in your wallet, you earn $rplts automatically — nothing to stake, nothing to sign, nothing ever leaves your wallet.",
    "when you're ready, hit claim and your $rplts get sent straight to you. that's it."
  ];

  let introIndex = 0;
  const introText = document.getElementById('introText');
  const introDots = document.getElementById('introDots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const introScreen = document.getElementById('introScreen');
  const finalScreen = document.getElementById('finalScreen');

  function renderDots() {
    introDots.innerHTML = '';
    introSlides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'intro-dot' + (i === introIndex ? ' active' : '');
      introDots.appendChild(dot);
    });
  }

  function renderIntro() {
    introText.textContent = introSlides[introIndex];
    prevBtn.disabled = introIndex === 0;
    nextBtn.textContent = (introIndex === introSlides.length - 1) ? "let's go" : 'next';
    renderDots();
  }

  function introNext() {
    if (introIndex < introSlides.length - 1) {
      introIndex++;
      renderIntro();
    } else {
      showFinal();
    }
  }

  function introPrev() {
    if (introIndex > 0) {
      introIndex--;
      renderIntro();
    }
  }

  function showFinal() {
    introScreen.style.display = 'none';
    finalScreen.classList.add('show');
  }

  function goCheck() {
    const wallet = document.getElementById('walletInput').value.trim();
    if (!wallet || !wallet.startsWith('r')) {
      alert('paste a valid xrpl wallet address (starts with r)');
      return;
    }
    window.location.href = `app.html?wallet=${wallet}`;
  }

  renderIntro();

  const bgAudio = document.getElementById('bgAudio');
  const soundToggle = document.getElementById('soundToggle');
  let soundOn = false;

  function toggleSound() {
    if (soundOn) {
      bgAudio.pause();
      soundToggle.textContent = '🔇';
      soundOn = false;
    } else {
      bgAudio.play().catch(() => {});
      soundToggle.textContent = '🔊';
      soundOn = true;
    }
  }
</script>
</body>
</html>
